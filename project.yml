name: Runline

options:
  bundleIdPrefix: com.matthewparris
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "28"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    RUNLINE_SDK_BRIDGE_URL: ""

targets:
  Runline:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Runline
    info:
      path: Runline/Resources/Info.plist
      properties:
        CFBundleDisplayName: Runline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        RunlineSDKBridgeDefaultURL: $(RUNLINE_SDK_BRIDGE_URL)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.matthewparris.runline
            CFBundleURLSchemes:
              - runline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewparris.runline
        PRODUCT_NAME: Runline
        DEVELOPMENT_TEAM: 5RAN7S95SJ
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Runline/Resources/Runline.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  RunlineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: RunlineTests
    dependencies:
      - target: Runline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewparris.runline.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Runline:
    build:
      targets:
        Runline: all
        RunlineTests: [test]
    test:
      config: Debug
      targets:
        - RunlineTests
    run:
      config: Debug
