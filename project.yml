name: CursorMobile

options:
  bundleIdPrefix: com.matthewparris
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  CursorMobile:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CursorMobile
    info:
      path: CursorMobile/Resources/Info.plist
      properties:
        CFBundleDisplayName: Runline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.matthewparris.runline
            CFBundleURLSchemes:
              - runline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewparris.runline
        PRODUCT_NAME: CursorMobile
        DEVELOPMENT_TEAM: 5RAN7S95SJ
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CursorMobile/Resources/CursorMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  CursorMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: CursorMobileTests
    dependencies:
      - target: CursorMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewparris.runline.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CursorMobile:
    build:
      targets:
        CursorMobile: all
        CursorMobileTests: [test]
    test:
      config: Debug
      targets:
        - CursorMobileTests
    run:
      config: Debug
