app = "your-runline-sdk-bridge"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  RUNLINE_BRIDGE_SESSION_STORE_PATH = "/data/runline-sdk-bridge/sessions.json"

[[mounts]]
  source = "runline_sdk_bridge_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
