name: Bug report
description: Report a reproducible Runline issue.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include Cursor API keys, Apple credentials, private repository contents, private prompts, artifact URLs, or other secrets.
  - type: input
    id: version
    attributes:
      label: App version
      description: Include the TestFlight build number or App Store version.
      placeholder: "Runline 1.0 (21)"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Cloud Agent
        - Automations
        - Settings
        - Onboarding
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Tap...\n3. See..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "iPhone/iPad model, iOS version, network conditions"
    validations:
      required: false
